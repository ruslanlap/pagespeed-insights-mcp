site_name: PageSpeed Insights MCP
site_description: User documentation for the PageSpeed Insights MCP Server
repo_url: https://github.com/ruslanlap/pagespeed-insights-mcp
repo_name: ruslanlap/pagespeed-insights-mcp
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
    primary: indigo
    accent: cyan

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  - git-revision-date-localized:
      enable_creation_date: false
      type: timeago
      fallback_to_build_date: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features:
    - Overview: features/index.md
    - Tools Reference: features/tools.md
  - Concepts:
    - What is MCP?: concepts/mcp.md
  - Developers:
    - Architecture: developers/architecture.md
    - Contributing: developers/contributing.md
# Custom CSS - Tokyo Night Storm (Flat #24283b)
extra_css:
  - stylesheets/extra.css   # ← now included
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
copyright: Copyright &copy; 2025–2026 ruslanlap