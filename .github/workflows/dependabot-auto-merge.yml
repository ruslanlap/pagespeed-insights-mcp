name: Dependabot guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-guard
  cancel-in-progress: false

jobs:
  review-and-merge:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    steps:
      - name: Review safe Dependabot updates
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allowedFiles = new Set(["package.json", "package-lock.json", "npm-shrinkwrap.json"]);
            const allowedConclusions = new Set(["success", "neutral", "skipped"]);

            const version = (value) => {
              const match = String(value).match(/^(\d+)\.(\d+)\.(\d+)/);
              return match ? match.slice(1).map(Number) : null;
            };

            const compareVersions = (left, right) => {
              const a = version(left);
              const b = version(right);
              if (!a || !b) return null;
              for (let index = 0; index < 3; index += 1) {
                if (a[index] !== b[index]) return a[index] - b[index];
              }
              return 0;
            };

            const dependencyFromTitle = (title) =>
              String(title).match(/^chore\(deps(?:-dev)?\): bump (.+?) from ([^ ]+) to ([^ ]+)$/i);

            async function candidateNumbers() {
              if (context.eventName === "pull_request_target") {
                return [context.payload.pull_request.number];
              }

              if (context.eventName === "workflow_run") {
                return (context.payload.workflow_run.pull_requests || []).map((pr) => pr.number);
              }

              const { data: pulls } = await github.rest.pulls.list({
                owner, repo, state: "open", base: context.payload.repository.default_branch, per_page: 100,
              });
              return pulls
                .filter((pr) => pr.user?.login === "dependabot[bot]")
                .map((pr) => pr.number);
            }

            async function closeSupersededPullRequests(current) {
              const title = dependencyFromTitle(current.title);
              if (!title) return;
              const [, dependency, , currentVersion] = title;
              const { data: pulls } = await github.rest.pulls.list({
                owner, repo, state: "open", base: current.base.ref, per_page: 100,
              });

              for (const older of pulls) {
                if (older.number === current.number || older.user?.login !== "dependabot[bot]") continue;
                const olderTitle = dependencyFromTitle(older.title);
                if (!olderTitle || olderTitle[1] !== dependency) continue;
                const ordering = compareVersions(olderTitle[3], currentVersion);
                if (ordering !== null && ordering < 0) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: older.number,
                    body: `Closing as superseded by #${current.number}, which updates \`${dependency}\` to a newer version.`,
                  });
                  await github.rest.pulls.update({
                    owner, repo, pull_number: older.number, state: "closed",
                  });
                }
              }
            }

            for (const number of [...new Set(await candidateNumbers())]) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });

              if (
                pr.state !== "open" ||
                pr.draft ||
                pr.user?.login !== "dependabot[bot]" ||
                pr.base.ref !== context.payload.repository.default_branch
              ) continue;

              const title = dependencyFromTitle(pr.title);
              if (!title) continue;
              const [, dependency, fromVersion, toVersion] = title;
              const before = version(fromVersion);
              const after = version(toVersion);
              if (!before || !after || before[0] !== after[0] || compareVersions(toVersion, fromVersion) <= 0) continue;

              const { data: files } = await github.rest.pulls.listFiles({
                owner, repo, pull_number: number, per_page: 100,
              });
              if (files.length === 0 || files.some((file) => !allowedFiles.has(file.filename))) continue;

              const { data: checks } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              });
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: pr.head.sha,
              });

              // This job appears in the check list while it is running. It is an
              // orchestrator, not a validation check, so exclude it to avoid waiting
              // for itself forever.
              const validationChecks = checks.check_runs.filter(
                (check) =>
                  check.name !== "review-and-merge" &&
                  !check.name.endsWith(" / review-and-merge")
              );
              const checksFinished = validationChecks.length > 0 &&
                validationChecks.every((check) =>
                  check.status === "completed" && allowedConclusions.has(check.conclusion)
                );
              const statusesSucceeded =
                status.state === "success" ||
                (status.state === "pending" && status.statuses.length === 0);

              if (!checksFinished || !statusesSucceeded || pr.mergeable === false) continue;

              try {
                const { data: result } = await github.rest.pulls.merge({
                  owner, repo, pull_number: number, sha: pr.head.sha, merge_method: "squash",
                  commit_title: `chore(deps): bump ${dependency} to ${toVersion}`,
                });

                if (result.merged) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: number,
                    body: `Merged automatically after CI passed. Safe update: \`${dependency}\` ${fromVersion} → ${toVersion}.`,
                  });
                  await closeSupersededPullRequests(pr);
                }
              } catch (error) {
                core.warning(`Could not merge #${number}: ${error.message}`);
              }
            }
