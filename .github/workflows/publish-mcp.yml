name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    # Self-healing: tags created by the release bot (GITHUB_TOKEN semantics)
    # do not trigger push events, so a release can slip past the tag trigger.
    # Daily no-op check: sync server.json to package.json version, publish
    # only if the registry is missing it.
    - cron: "0 6 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Sync server.json version with tag (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Sync server.json version with package.json (schedule/dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION=$(jq -r .version package.json)
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "Synced server.json to ${VERSION}"

      - name: Publish server to MCP Registry
        run: |
          V=$(jq -r .version server.json)
          if curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.ruslanlap%2Fpagespeed-insights-mcp/versions/${V}" >/dev/null; then
            echo "Version ${V} already in registry, skipping publish"
          else
            ./mcp-publisher publish
          fi
