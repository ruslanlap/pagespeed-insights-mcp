name: Manual Publish

# Allows re-running the dual-publish step after fixing NPM_TOKEN credentials
# without needing to trigger a new semantic-release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would be published without actually publishing)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: registry-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Dual-publish to Registries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Checkout latest release tag
        run: |
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "No release tag found" >&2
            exit 1
          fi
          git checkout "$TAG"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          echo "Using tag $TAG"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Would publish pagespeed-insights-mcp@$VERSION and @ruslanlap/pagespeed-insights-mcp@$VERSION"
          npm pack --dry-run

      - name: Dual-publish to Registries
        if: ${{ !inputs.dry_run }}
        run: |
          chmod +x ./scripts/publish.sh
          ./scripts/publish.sh

      - name: Upload release assets and verify integrity
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(git describe --tags --exact-match HEAD)
          ASSET="pagespeed-insights-mcp-${TAG}-dist.tar.gz"
          tar -czf "$ASSET" dist package.json README.md
          sha256sum "$ASSET" > "${ASSET}.sha256"
          gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --clobber
          INFO=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          [ "$(echo "$INFO" | jq '.assets | length')" -ge 2 ] || { echo "Release assets missing"; exit 1; }
          [ "$(npm view pagespeed-insights-mcp@latest version)" = "${TAG#v}" ] || { echo "npm latest does not match $TAG"; exit 1; }
