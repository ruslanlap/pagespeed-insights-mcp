version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # GitHub-side: Dependabot security updates must be enabled in
    # Settings → Code security → Dependabot security updates. With it on,
    # dependabot opens daily PRs for any GHSA in the dependency graph and the
    # dependabot-auto-merge guard above still applies (npm-only file changes).
    groups:
      # Group MCP SDK updates together
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      # Group TypeScript tooling updates
      typescript:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "tsx"
      # Group testing tools
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "nock"
          - "@types/supertest"
      # Group linting/formatting tools
      linting:
        patterns:
          - "eslint"
          - "prettier"
      # Group semantic-release tooling
      release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"
      # Group type definitions
      types:
        patterns:
          - "@types/*"
    # nock >= 15 routes through @mswjs/interceptors and requires Node >= 22;
    # this package still supports Node 20 (engines: >=20.19.0), so nock major
    # bumps are deferred until Node 20 support is dropped.
    ignore:
      - dependency-name: "nock"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "docker"
    commit-message:
      prefix: "chore(docker)"
