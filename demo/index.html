<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #000000;
    --bg2: #080808;
    --bg3: #111111;
    --surface: #0d0d0f;
    --surface-hover: #141417;
    --border: rgba(255, 255, 255, 0.1);
    --border-hover: rgba(255, 255, 255, 0.24);
    --text: #ededed;
    --text-dim: #888888;
    --accent: #ffffff;
    --accent-blue: #0070f3;
    --accent-cyan: #50e3c2;
    --green: #00e599;
    --green-dim: rgba(0, 229, 153, 0.12);
    --yellow: #f5a623;
    --yellow-dim: rgba(245, 166, 35, 0.12);
    --red: #ff0055;
    --red-dim: rgba(255, 0, 85, 0.12);
    --gradient: linear-gradient(180deg, #ffffff 0%, #888888 100%);
    --gradient-blue: linear-gradient(135deg, #0070f3, #00dfd8);
    --glow: 0 0 35px rgba(0, 112, 243, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: var(--border) var(--bg);
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.6;
    background-image: 
      radial-gradient(circle at 50% -20%, rgba(0, 112, 243, 0.15) 0%, transparent 65%),
      linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 100% 100%, 32px 32px, 32px 32px;
  }

  /* ============ CANVAS PARTICLES ============ */
  #particles-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ============ NAV ============ */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(0, 0, 0, 0.75);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    transition: all .3s;
  }
  nav.scrolled { background: rgba(0, 0, 0, 0.95); box-shadow: 0 4px 24px rgba(0,0,0,0.8); }
  
  .nav-brand {
    display: flex; align-items: center; gap: .75rem; font-weight: 700; font-size: 1.05rem;
    color: #fff; text-decoration: none;
  }
  .nav-brand svg { width: 28px; height: 28px; }
  .badge-v2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; font-weight: 600;
    padding: 0.15rem 0.45rem; border-radius: 999px;
    background: var(--bg3); color: #fff;
    border: 1px solid var(--border);
  }

  .nav-links { display: flex; gap: 1.75rem; list-style: none; align-items: center; }
  .nav-links a {
    color: var(--text-dim); text-decoration: none; font-size: .875rem; font-weight: 500;
    transition: color .2s;
  }
  .nav-links a:hover { color: #fff; }
  
  .nav-actions {
    display: flex; align-items: center; gap: 0.75rem;
  }

  .nav-cta {
    background: #fff;
    color: #000; border: none; border-radius: 8px;
    padding: .45rem 1.15rem; font-size: .85rem; font-weight: 600;
    cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: .45rem;
    transition: transform .2s, background .2s;
  }
  .nav-cta:hover { transform: translateY(-1px); background: #eaeaea; }

  /* Mobile Hamburger Button */
  .hamburger-btn {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--bg3);
    border: 1px solid var(--border);
    cursor: pointer;
    gap: 5px;
    padding: 8px;
  }
  .hamburger-line {
    width: 100%;
    height: 2px;
    background-color: var(--text);
    border-radius: 2px;
    transition: all 0.25s ease;
  }
  .hamburger-btn.active .hamburger-line:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }
  .hamburger-btn.active .hamburger-line:nth-child(2) {
    opacity: 0;
  }
  .hamburger-btn.active .hamburger-line:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  /* Mobile Drawer Menu */
  .mobile-drawer {
    display: none;
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    background: rgba(8, 8, 10, 0.98);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem;
    flex-direction: column;
    gap: 0.75rem;
    z-index: 99;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
    transform: translateY(-10px);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
  }
  .mobile-drawer.open {
    display: flex;
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .mobile-drawer a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 0.75rem 0.6rem;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .mobile-drawer a:hover {
    color: #fff;
    background: var(--bg3);
  }

  /* ============ HERO ============ */
  .hero {
    position: relative;
    min-height: 92vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 6.5rem 1.5rem 4rem;
    z-index: 1;
  }
  .hero-content { max-width: 900px; position: relative; }

// ============ CANVAS PARTICLES (Vercel-style clean cyan/blue dots) ============
const canvas = document.getElementById('particles-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 1.5 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.35;
    this.speedY = (Math.random() - 0.5) * 0.35;
    this.opacity = Math.random() * 0.35 + 0.15;
    this.isBlue = Math.random() > 0.4;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.isBlue ? `rgba(0, 112, 243, ${this.opacity})` : `rgba(255, 255, 255, ${this.opacity * 0.8})`;
    ctx.fill();
  }
}
for (let i = 0; i < 70; i++) particles.push(new Particle());

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 110) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(0, 112, 243, ${0.08 * (1 - dist / 110)})`;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

        else if (target >= 50) circle.setAttribute('stroke', '#f5a623');
        else circle.setAttribute('stroke', '#ff0055');
      });

  });

      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'typing-indicator';
        el.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
        el.id = 'typing-' + i;
        body.appendChild(el);
        setTimeout(() => el.classList.add('visible'), 40);
      }, delay);
      delay += msg.delay;
      setTimeout(() => {
        const el = document.getElementById('typing-' + i);
        if (el) el.remove();
      }, delay);
    } else {
      delay += 250;
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = `chat-msg chat-${msg.type}`;
        el.innerHTML = msg.html || msg.text;
        body.appendChild(el);
        setTimeout(() => el.classList.add('visible'), 40);
        body.scrollTop = body.scrollHeight;
      }, delay);
    }
  });

  setTimeout(() => { chatAnimating = false; }, delay + 400);
  runTerminalDemo(type);
}

function runTerminalDemo(type) {
  const body = document.getElementById('terminal-body');
  body.innerHTML = '';
  const lines = terminalDemos[type] || terminalDemos.analyze;
  let delay = 0;

  lines.forEach(line => {
    delay += line.delay;
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'term-line';
      el.innerHTML = line.text;
      body.appendChild(el);
      setTimeout(() => el.classList.add('visible'), 25);
      body.scrollTop = body.scrollHeight;
    }, delay);
  });

  delay += 250;
  setTimeout(() => {
    const el = document.createElement('div');
    el.className = 'term-line';
    el.innerHTML = '<span class="term-prompt">$</span> <span class="cursor-blink"></span>';
    body.appendChild(el);
    setTimeout(() => el.classList.add('visible'), 25);
  }, delay);
}
